name: Local Stack Verification Pipeline

on:
  push:
    branches: [main, develop]
    # Run on everything EXCEPT these specific files
    paths-ignore:
      - "**.md" # Ignores all Markdown files (like README.md)
      - ".gitignore" # Ignores changes to your git ignore file
      - ".dockerignore" # Ignores changes to your docker ignore file

  pull_request:
    branches: [main]
    # Match the same ignore rules for Pull Requests
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - ".dockerignore"

jobs:
  verify-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compile Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false # This tests the build without pushing anywhere!
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compile Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false # This tests the build without pushing anywhere!
          cache-from: type=gha
          cache-to: type=gha,mode=max
